[project]
name = "erp-docflow-api"
version = "0.1.0"
description = "Backend mínimo do ERP DocFlow"
readme = "README.md"
requires-python = ">=3.13.14,<3.14"
dependencies = [
  "alembic>=1.18.5,<1.19",
  "fastapi>=0.139.2,<0.140",
  "pydantic>=2.13.4,<3",
  "psycopg[binary]>=3.3.4,<3.4",
  "sqlalchemy>=2.0.51,<2.1",
  "uvicorn>=0.51.0,<0.52",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<0.29",
  "pytest>=9.1.1,<10",
  "ruff>=0.15.22,<0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
markers = [
  "postgres: requires a disposable PostgreSQL database",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["erp_docflow_api"]
