name: Application CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend / lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: apps/api/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          working-directory: apps/api
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -m "not postgres"

  postgresql:
    name: PostgreSQL / migrations and integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COMPOSE_PROJECT_NAME: erp_docflow_ci_${{ github.run_id }}_${{ github.run_attempt }}
      ERP_DOCFLOW_DATABASE_NAME: erp_docflow_ci
      ERP_DOCFLOW_DATABASE_USER: erp_docflow_ci
      ERP_DOCFLOW_DATABASE_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build API image
        run: docker compose build api

      - name: Start disposable PostgreSQL
        run: docker compose up --detach --wait postgres

      - name: Validate one Alembic head
        run: >-
          docker compose run -T --rm --no-deps api uv run python -c
          'from alembic.config import Config; from alembic.script import ScriptDirectory;
          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads();
          assert len(heads) == 1, f"expected exactly one Alembic head, got {heads}"'

      - name: Validate migrations
        run: |
          docker compose run -T --rm --no-deps api uv run alembic upgrade head
          docker compose run -T --rm --no-deps api uv run alembic current --check-heads
          docker compose run -T --rm --no-deps api uv run alembic check

      - name: Validate disposable database migration cycle
        run: |
          docker compose run -T --rm --no-deps api uv run alembic downgrade base
          docker compose run -T --rm --no-deps api uv run alembic upgrade head
          docker compose run -T --rm --no-deps api uv run alembic current --check-heads
          docker compose run -T --rm --no-deps api uv run alembic check

      - name: Test with PostgreSQL
        run: docker compose run -T --rm --no-deps api uv run pytest -m postgres

      - name: Seed synthetic relational restart probe
        run: >-
          docker compose run -T --rm --no-deps api
          sh -c 'PYTHONPATH=src uv run python
          tests/integration/postgresql/restart_probe.py seed'

      - name: Verify materialization after PostgreSQL restart
        run: |
          docker compose restart postgres
          docker compose up --detach --wait postgres
          docker compose run -T --rm --no-deps api uv run alembic current --check-heads
          docker compose run -T --rm --no-deps api sh -c 'PYTHONPATH=src uv run python tests/integration/postgresql/restart_probe.py verify'

      - name: Remove disposable PostgreSQL state
        if: always()
        run: docker compose down --volumes --remove-orphans

  frontend:
    name: Frontend / quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "11.13.1"
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @erp-docflow/web lint

      - name: Typecheck
        run: pnpm --filter @erp-docflow/web typecheck

      - name: Test
        run: pnpm --filter @erp-docflow/web test

      - name: Build
        run: pnpm --filter @erp-docflow/web build

  compose:
    name: Compose / configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      ERP_DOCFLOW_DATABASE_NAME: erp_docflow_compose_ci
      ERP_DOCFLOW_DATABASE_USER: erp_docflow_compose_ci
      ERP_DOCFLOW_DATABASE_PASSWORD: compose-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose model
        run: |
          docker compose version
          docker compose config --quiet
